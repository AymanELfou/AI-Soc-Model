version: '3.3'

services:
  ai-security-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_vps_security_agent
    restart: always
    network_mode: "host"
    environment:
      - SERVER_HOSTNAME=${HOSTNAME:-vps-production-01}
      - MODEL_DIR=/app/trained_model
      - DATABASE_DIR=/app/database
      - LOG_DIR=/app/logs
      - CONFIDENCE_THRESHOLD=0.55
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-aymaneelfounti@gmail.com}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - ALERT_DEDUPLICATION_WINDOW_MINUTES=15
    volumes:
      # Mount host log directories for real-time monitoring
      - /var/log:/var/log:ro
      - ./logs:/app/logs
      - ./database:/app/database
      - ./trained_model:/app/trained_model:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
